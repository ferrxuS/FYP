[project]
name = "fyp"
version = "0.1.0"
description = "Shipping Container Defect Segmentation using Continual Learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0,<2.6.0",
    "torchvision",
    "pillow",
    "numpy<2.0.0",
    "matplotlib",
    "tqdm",
    "transformers",
    "huggingface-hub",
    "seaborn",
    "pycocotools",
    "opencv-python",
    "streamlit>=1.58.0",
    "pyarrow<16.0.0",
    "libcst<1.2.0",	
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

